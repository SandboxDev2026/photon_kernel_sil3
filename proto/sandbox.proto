syntax = "proto3";

package photon.sandbox;

service SandboxService {
    // 同步执行任务
    rpc Execute(SandboxRequest) returns (SandboxResponse);

    // 异步执行任务（不等待结果，通过回调或轮询获取）
    rpc ExecuteAsync(SandboxRequest) returns (AsyncResponse);

    // 获取池状态
    rpc GetPoolStatus(EmptyRequest) returns (PoolStatusResponse);

    // 查询异步任务结果（ExecuteAsync 提交后用 task_id 查询）
    rpc GetTaskResult(TaskResultRequest) returns (TaskResultResponse);
}

message SandboxRequest {
    string task_name = 1;
    string task_code = 2;              // 实际要执行的代码/命令
    int32 timeout_ms = 3;              // 超时时间（毫秒）
    RiskLevel risk_level = 4;
    map<string, string> environment = 5; // 环境变量
    int32 runner = 8;                  // 0=python3, 1=node, 2=shell（默认 0）
}

message SandboxResponse {
    bool success = 1;
    string output = 2;                 // 标准输出
    string error = 3;                  // 标准错误
    int64 cpu_time_us = 4;
    int64 memory_peak_bytes = 5;
    int32 exit_code = 6;
    string error_code = 7;             // 错误码字符串
}

message AsyncResponse {
    string task_id = 1;
    string status = 2;                 // "pending", "running", "completed", "failed"
}

message PoolStatusResponse {
    int32 total = 1;
    int32 idle = 2;
    int32 busy = 3;
    int32 failed = 4;
}

enum RiskLevel {
    LOW = 0;
    MEDIUM = 1;
    HIGH = 2;
}

message EmptyRequest {}

message TaskResultRequest {
    string task_id = 1;
}

message TaskResultResponse {
    bool found = 1;           // 任务是否存在
    bool completed = 2;       // 是否已完成
    bool success = 3;
    string output = 4;
    string error = 5;
    int64 cpu_time_us = 6;
    int64 memory_peak_bytes = 7;
    int32 exit_code = 8;
}

// ===== 审计日志批量上报（Client Streaming）=====
// 沙盒节点侧异步队列攒批，通过客户端流式 RPC 一次发送多条审计记录；
// 比逐条 unary 调用减少 RTT，适合高吞吐审计上报场景。
service AuditService {
    // 客户端流式批量上报：客户端连续 Write 多条 AuditRecord，结束后服务端返回汇总应答
    rpc BatchReport(stream AuditRecord) returns (BatchReportResp);
}

message AuditRecord {
    string event_id = 1;     // 审计事件唯一 ID（如 UUID 或哈希链前一个 hash）
    int64 timestamp = 2;     // 事件时间戳（unix epoch 微秒）
    string payload = 3;      // JSON 格式的审计事件内容（含 HMAC 哈希链等）
}

message BatchReportResp {
    int32 ok_count = 1;      // 服务端成功接收的记录数
    int32 failed_count = 2;  // 服务端拒绝/失败的记录数
}
